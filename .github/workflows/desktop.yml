# Builds the desktop installers on GitHub's free Windows, macOS and Linux runners.
# Run it from the Actions tab ("Run workflow"): with a version (e.g. v0.2.0) it also publishes a GitHub Release, which
# the website's /download page links to. Pushing a tag like v0.2.0 does the same.
name: Desktop installers
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish, e.g. v0.2.0 (leave empty for a test build)"
        required: false
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:desktop
      - run: npm run build:desktop
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: ledgerfox-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.version, 'v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: gh release create "$VERSION" out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "LedgerFox $VERSION" --notes "Desktop installers for Windows, macOS and Linux. See DESKTOP.md for first-run steps on unsigned builds."
