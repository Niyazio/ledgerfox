# Builds the desktop installers on GitHub's free Windows, macOS and Linux runners.
# Run it from the Actions tab ("Run workflow"): with a version (e.g. v0.2.0) it also publishes a GitHub Release, which
# the website's /download page links to. Pushing a tag like v0.2.0 does the same.
name: Desktop installers
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish, e.g. v0.2.0 (leave empty for a test build)"
        required: false
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run desktop:tools
      - run: npx tsc -p tsconfig.desktop.json --noEmit
      - run: npm run test:desktop
      - run: npm run build:desktop
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: ledgerfox-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.zip
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build the web app that ships inside the APK
        working-directory: .
        run: npm ci && npm run build && rm -rf mobile/www && cp -r dist mobile/www
      - run: npm install --no-audit --no-fund
      - name: Create the Android project
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ inputs.version || github.ref_name }}
        run: npx cap add android && node scripts/prepare-android.mjs && npx cap sync android
      - name: Build release APK
        run: cd android && ./gradlew --no-daemon assembleRelease
      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            PASS="$KEYSTORE_PASSWORD"
          else
            # No signing key configured: a temporary key is generated, so installing a newer build needs the old one uninstalled.
            PASS=$(openssl rand -hex 16)
            keytool -genkeypair -keystore release.jks -storepass "$PASS" -keypass "$PASS" -alias ledgerfox -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=LedgerFox"
            echo "::warning::APK signed with a temporary key. Add ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets for stable updates."
          fi
          "$BT/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-pass "pass:$PASS" --ks-key-alias ledgerfox --out ../LedgerFox-android.apk aligned.apk
          "$BT/apksigner" verify ../LedgerFox-android.apk
          rm -f release.jks
      - uses: actions/upload-artifact@v4
        with:
          name: ledgerfox-android
          path: LedgerFox-android.apk
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.version, 'v')
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version || github.ref_name }}
        # Release notes come from docs/releases/<version>.md when present (the apps show them under "What's new").
        run: |
          NOTES="docs/releases/$VERSION.md"
          if [ -f "$NOTES" ]; then printf '\n\nInstallers for Windows, macOS, Linux and Android. See DESKTOP.md for first-run steps on unsigned builds.\n' >> "$NOTES"; else NOTES=$(mktemp); echo "Installers for Windows, macOS, Linux and Android. See DESKTOP.md for first-run steps on unsigned builds." > "$NOTES"; fi
          gh release create "$VERSION" out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "LedgerFox $VERSION" --notes-file "$NOTES"
