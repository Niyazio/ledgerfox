# Deploys the website (Cloudflare Worker + D1 migrations) on every push to main, after the checks pass.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers" + D1 Edit) and CLOUDFLARE_ACCOUNT_ID.
name: Deploy website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-website
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check secrets
        id: secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::warning::CLOUDFLARE_API_TOKEN is not set; skipping deploy (Cloudflare Workers Builds may deploy instead)."; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.secrets.outputs.ok == 'true'
        run: npm ci
      - if: steps.secrets.outputs.ok == 'true'
        run: npm run lint && npm run typecheck && npm test
      - if: steps.secrets.outputs.ok == 'true'
        run: npm run build
      - if: steps.secrets.outputs.ok == 'true'
        name: Apply database migrations and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply ledgerfox --remote && npx wrangler deploy
      # Payment, email and seller settings may be kept as GitHub repository secrets; copy the ones that are set into
      # the Worker's own secrets (the running website cannot read GitHub secrets). Values are never printed.
      - if: steps.secrets.outputs.ok == 'true'
        name: Copy app secrets from GitHub to the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
          VENDOR_ADMIN_EMAILS: ${{ secrets.VENDOR_ADMIN_EMAILS }}
          VENDOR_LEGAL_NAME: ${{ secrets.VENDOR_LEGAL_NAME }}
          VENDOR_GSTIN: ${{ secrets.VENDOR_GSTIN }}
          VENDOR_ADDRESS: ${{ secrets.VENDOR_ADDRESS }}
          VENDOR_STATE_CODE: ${{ secrets.VENDOR_STATE_CODE }}
        run: |
          umask 077
          node -e '
            const names = ["RAZORPAY_KEY_ID","RAZORPAY_KEY_SECRET","RAZORPAY_WEBHOOK_SECRET","RESEND_API_KEY","EMAIL_FROM","EMAIL_REPLY_TO","VENDOR_ADMIN_EMAILS","VENDOR_LEGAL_NAME","VENDOR_GSTIN","VENDOR_ADDRESS","VENDOR_STATE_CODE"];
            const out = {};
            for (const n of names) { const v = (process.env[n] || "").trim(); if (v) out[n] = v; }
            require("fs").writeFileSync("app-secrets.json", JSON.stringify(out));
            console.log(Object.keys(out).length ? "Copying: " + Object.keys(out).join(", ") : "No app secrets in GitHub; keeping the ones already on the Worker.");
          '
          if [ "$(cat app-secrets.json)" != "{}" ]; then npx wrangler secret bulk app-secrets.json; fi
          rm -f app-secrets.json
      - if: steps.secrets.outputs.ok == 'true'
        name: Smoke test
        run: |
          sleep 5
          curl -fsS https://ledgerfox.niyazio.com/api/health | tee /dev/stderr | grep -q '"status":"ok"'
