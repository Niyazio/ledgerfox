# Desktop installers. Unsigned builds (no paid certificates): see DESKTOP.md for the one-time "open anyway" steps.
appId: com.niyazio.ledgerfox
productName: Foxlator
electronVersion: 44.9.2
copyright: "Copyright © Niyazio (niyazio.com). MIT licence."
directories:
  output: release
  buildResources: build
files:
  - desktop-build/**
  - package.json
  - "!node_modules/**"
extraResources:
  - from: dist
    to: web
  - from: migrations
    to: migrations
asar: true
fileAssociations:
  - ext: ledgerfox
    name: Foxlator data
    description: Foxlator accounting data (older versions, opens view-only)
    role: Viewer
win:
  # Shown in the file's Properties → Details and in Windows' prompts.
  legalTrademarks: "Foxlator is a product of Niyazio"
  target:
    - target: nsis
      arch: [x64]
# Microsoft Store package (free to publish for individual developers). The Store signs it and updates it, so Windows
# shows no "unknown publisher" warning. identityName / publisher come from Partner Center (repository variables).
appx:
  displayName: Foxlator
  applicationId: Foxlator
  backgroundColor: "#1d4ed8"
  languages: [en-US, ar, hi]
  artifactName: Foxlator-Store-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: Foxlator-Setup-${arch}.${ext}
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.finance
  # Needed for barcode / QR scanning with the Mac's camera.
  extendInfo:
    NSCameraUsageDescription: "Foxlator uses the camera to scan product barcodes and QR codes."
  # Ad-hoc signature only (Apple Developer ID costs money); required for Apple Silicon to launch at all.
  identity: "-"
  artifactName: Foxlator-mac-${arch}.${ext}
linux:
  target: [AppImage]
  category: Office
  artifactName: Foxlator-linux-${arch}.${ext}
# Update metadata (latest.yml) for in-app auto-update from GitHub Releases.
publish:
  provider: github
  owner: Niyazio
  repo: ledgerfox
