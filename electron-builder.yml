# Desktop installers. Unsigned builds (no paid certificates): see DESKTOP.md for the one-time "open anyway" steps.
appId: com.niyazio.ledgerfox
productName: LedgerFox
electronVersion: 44.9.2
copyright: "Copyright © Niyazio (niyazio.com). MIT licence."
directories:
  output: release
  buildResources: build
files:
  - desktop-build/**
  - package.json
  - "!node_modules/**"
extraResources:
  - from: dist
    to: web
  - from: migrations
    to: migrations
asar: true
fileAssociations:
  - ext: ledgerfox
    name: LedgerFox data
    description: LedgerFox accounting data (older versions, opens view-only)
    role: Viewer
win:
  # Shown in the file's Properties → Details and in Windows' prompts.
  legalTrademarks: "LedgerFox is a product of Niyazio"
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: LedgerFox-Setup-${arch}.${ext}
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.finance
  # Ad-hoc signature only (Apple Developer ID costs money); required for Apple Silicon to launch at all.
  identity: "-"
  artifactName: LedgerFox-mac-${arch}.${ext}
linux:
  target: [AppImage]
  category: Office
  artifactName: LedgerFox-linux-${arch}.${ext}
# Update metadata (latest.yml) for in-app auto-update from GitHub Releases.
publish:
  provider: github
  owner: Niyazio
  repo: ledgerfox
